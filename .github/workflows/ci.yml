name: CI

on: [push, pull_request]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No install step: the app and its tests have zero npm dependencies and
      # run on Node's built-in test runner.
      - name: Run tests
        run: node --test test/*.test.mjs
